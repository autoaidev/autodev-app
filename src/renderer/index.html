<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>AutoDev</title>
  </head>
  <body style="margin:0;background:#0f1216">
    <!-- Zero-JS first-paint skeleton: a branded nav silhouette React paints over
         on mount, so cold start never flashes a blank white frame. -->
    <div id="root">
      <div style="height:100vh;background:#0f1216;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <div style="display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;background:#14171c;border-bottom:1px solid #22262e">
          <div style="width:16px;height:16px;border-radius:4px;background:#4a9eff"></div>
          <div style="font-size:13px;font-weight:700;color:#e4e8ee;letter-spacing:-.01em">AutoDev</div>
          <div style="margin-left:12px;display:flex;gap:6px">
            <div style="width:52px;height:14px;border-radius:5px;background:#1c2027"></div>
            <div style="width:40px;height:14px;border-radius:5px;background:#16191f"></div>
            <div style="width:46px;height:14px;border-radius:5px;background:#16191f"></div>
            <div style="width:58px;height:14px;border-radius:5px;background:#16191f"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 46px);color:#7d848f;font-size:12px">
          Loading your agents…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
