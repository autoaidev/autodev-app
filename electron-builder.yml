appId: works.aioffice.autodev
productName: AutoDev
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - '!**/*.map'
# node-pty ships a native .node addon — keep it outside the asar so it can load.
asarUnpack:
  - '**/node_modules/node-pty/**'
# Bundle a self-contained autodev-cli into resources/autodev-cli so the app finds
# it out of the box (resolveCliJs checks resources/autodev-cli/bin/autodev.js).
extraResources:
  - from: vendor/autodev-cli
    to: autodev-cli
  # Tray icon. Ships to <resourcesPath>/icon.png in every target (the same root
  # the CLI uses), which createTray() reads. 32x32 is the crisp source; the tray
  # code resizes to 18x18. Without this the tray icon was invisible on Linux.
  - from: build/icons/32x32.png
    to: icon.png
linux:
  target:
    - AppImage
    - deb
  # Show up under "Development" in the desktop app menu.
  category: Development
  # Icon SET dir (<size>x<size>.png). A single build/icon.png made
  # electron-builder install to hicolor/0x0/ (unresolvable → blank menu icon);
  # a proper size set installs to hicolor/<size>/apps so the menu shows the icon.
  icon: build/icons
  maintainer: autoaidev
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
